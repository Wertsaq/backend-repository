service: authorization-service

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.11
  stage: dev
  region: us-east-1

  httpApi:
    authorizers:
      basicAuth:
        type: request
        functionName: authorizationService

functions:
  authorizationService:
    name: authorizationService
    handler: handler.lambda_handler

plugins:
  - serverless-dotenv-plugin
